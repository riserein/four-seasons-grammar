<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师后台 - 四季语法游戏</title>
<style>
:root {
  --primary: #4CAF50; --primary-dark: #388E3C; --primary-light: #C8E6C9;
  --bg: #f5f7f5; --card-bg: #fff; --text: #333;
  --text-secondary: #666; --border: #e0e0e0;
  --danger: #f44336; --success: #4CAF50; --accent: #FF9800;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --radius: 12px;
  --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }

.navbar {
  background:var(--card-bg); padding:0 24px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; height:56px;
}
.navbar .logo { font-size:20px; font-weight:700; color:var(--primary); }
.navbar .logout { color:var(--danger); cursor:pointer; font-size:14px; font-weight:500; }

.container { max-width:1000px; margin:0 auto; padding:24px; }
.card {
  background:var(--card-bg); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:24px; margin-bottom:16px;
}
.card h3 { margin-bottom:16px; font-size:18px; }

.tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:20px; }
.tab-btn {
  padding:10px 24px; cursor:pointer; font-size:15px; font-weight:500;
  color:var(--text-secondary); border-bottom:3px solid transparent;
  margin-bottom:-2px; transition:all 0.2s;
  background:none; border-top:none; border-left:none; border-right:none; font-family:var(--font);
}
.tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }

.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 18px; border:none; border-radius:8px; font-size:14px;
  cursor:pointer; font-family:var(--font); font-weight:500; transition:all 0.2s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-outline { background:transparent; border:2px solid var(--primary); color:var(--primary); }
.btn-sm { padding:5px 12px; font-size:12px; }

input, select, textarea {
  width:100%; padding:8px 12px; border:1px solid var(--border);
  border-radius:8px; font-size:14px; font-family:var(--font);
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
.form-group { margin-bottom:12px; }
.form-group label { display:block; margin-bottom:4px; font-weight:500; font-size:13px; color:var(--text-secondary); }
.form-row { display:flex; gap:12px; }
.form-row > * { flex:1; }

table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); }
th { font-weight:600; color:var(--text-secondary); font-size:13px; background:var(--bg); }
tr:hover { background:#fafafa; }

.badge {
  display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600;
}
.badge-green { background:#C8E6C9; color:#2E7D32; }
.badge-blue { background:#BBDEFB; color:#1565C0; }

.page { display:none; }
.page.active { display:block; }

.modal-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--card-bg); border-radius:var(--radius); padding:30px;
  max-width:520px; width:90%; max-height:80vh; overflow-y:auto;
}
.modal .close { float:right; cursor:pointer; font-size:20px; color:var(--text-secondary); background:none; border:none; }

@media (max-width:600px) {
  .container { padding:12px; }
  .form-row { flex-direction:column; }
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">🍂 四季语法 · 教师后台</div>
  <div class="logout" onclick="doLogout()">退出登录</div>
</nav>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('questions')">📝 默认题库管理</button>
    <button class="tab-btn" onclick="switchTab('students')">👨‍🎓 学生管理</button>
    <button class="tab-btn" onclick="switchTab('shared')">🤝 共享题库</button>
    <button class="tab-btn" onclick="switchTab('classes')">🏫 班级管理</button>
  </div>

  <!-- 题库管理 -->
  <div class="page active" id="page-questions">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin-bottom:0">默认题库（共 <span id="total-qs">0</span> 题）</h3>
        <button class="btn btn-primary" onclick="showAddQuestion()">+ 添加题目</button>
        <button class="btn btn-outline btn-sm" onclick="showImportModal()">📥 批量导入</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>ID</th><th>句子</th><th>高亮词</th><th>正确答案</th><th>难度</th><th>操作</th></tr>
          </thead>
          <tbody id="questions-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 学生管理 -->
  <div class="page" id="page-students">
    <div class="card">
      <h3>学生列表 <button class="btn btn-outline btn-sm" onclick="exportData()" style="margin-left:12px">📊 导出成绩CSV</button></h3>
      <table>
        <thead><tr><th>用户名</th><th>积分</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody id="students-table"></tbody>
      </table>
    </div>
  </div>

  <!-- 共享题库审核 -->
  <div class="page" id="page-shared">
    <div class="card">
      <h3>共享题库列表</h3>
      <table>
        <thead><tr><th>题库名</th><th>创建者</th><th>题目数</th><th>操作</th></tr></thead>
        <tbody id="shared-table"></tbody>
      </table>
    </div>
  </div>

  <!-- 班级管理 -->
  <div class="page" id="page-classes">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin-bottom:0">班级列表</h3>
        <button class="btn btn-primary" onclick="showCreateClass()">+ 创建班级</button>
      </div>
      <table>
        <thead><tr><th>班级名</th><th>邀请码</th><th>人数</th><th>操作</th></tr></thead>
        <tbody id="classes-table"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 编辑题目弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-body"></div>
</div>

<script src="js/teacher.js"></script>
</body>
</html>
